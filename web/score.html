<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final Buzzer: the scorer's phone</title>
<meta name="description" content="Score a game from the bench. The agent is watching for the final buzzer.">
<meta name="theme-color" content="#E3D5A6">
<link rel="icon" href="/brand/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/board.css">
<style>
.score-page .page { max-width: 520px; }
.score-page .housing { padding: 14px 14px 18px; }
.score-page .pick { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
.score-page .pick button { border: 0; background: transparent; color: var(--ghost); font-weight: 600; font-size: 13px; padding: 8px 10px; cursor: pointer; clip-path: var(--chamfer-3); min-height: 40px; }
.score-page .pick button[aria-pressed="true"] { background: var(--flap); color: var(--housing); }
.games { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--rim); }
.games li { padding: 10px 2px; border-bottom: 1px solid var(--rim); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; }
.games b { font-size: 15px; font-weight: 700; }
.games .when { font-size: 13px; color: var(--ghost); text-align: right; white-space: nowrap; }
.games small { grid-column: 1 / -1; font-size: 11px; color: var(--ghost); }
.games .state { font-size: 12px; font-weight: 600; color: var(--flap); }
.games .state.paid { color: var(--yellow); }
.games li.open { background: var(--black-face); margin: 0 -6px; padding: 10px 8px; clip-path: var(--chamfer); }
.sheet { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-top: 8px; }
.sheet label { display: grid; gap: 4px; font-size: 11px; color: var(--ghost); }
.sheet input { width: 100%; font: 700 28px/1 var(--display); color: var(--housing); background: var(--flap); border: 0; padding: 6px 8px; text-align: center; clip-path: var(--chamfer); }
.sheet .v { font-family: var(--display); font-size: 22px; color: var(--ghost); padding-top: 14px; }
.acts { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin-top: 8px; }
.acts .btn { width: 100%; }
.saved { grid-column: 1 / -1; font-size: 12px; color: var(--yellow); margin-top: 6px; }
.saved:empty { display: none; }
.nav a { color: var(--ink-muted); text-decoration: none; font-size: 13px; font-weight: 600; padding: 8px 10px; clip-path: var(--chamfer-3); }
.nav a[aria-current] { background: var(--housing); color: var(--flap); }
.intro { margin: 0 0 10px; font-size: 13px; color: var(--ghost); }
</style>
</head>
<body class="score-page">
<div class="page">
  <header class="table-top">
    <a class="lockup" href="/" aria-label="Final Buzzer"><img class="wm" src="/brand/wordmark.svg" alt="Final Buzzer" width="137" height="27"></a>
    <nav class="nav" aria-label="Pages"><a href="/">The board</a><a href="/score.html" aria-current="page">Score</a></nav>
  </header>
  <main class="housing" id="board" tabindex="-1">
    <h1 class="sr">The scorer's phone</h1>
    <p class="intro">Tap a game, enter the score, tap Final. The agent is watching the document and pays the officials the moment it saves.</p>
    <div class="pick" id="days" role="group" aria-label="Day"></div>
    <div class="pick" id="courts" role="group" aria-label="Court"></div>
    <ol class="games" id="games"></ol>
  </main>
  <footer>Scores saved here go into the tournament document the agent reads. Test money, composite association.</footer>
</div>
<script type="module" src="/score.js"></script>
</body>
</html>
