<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bryntum smoke test</title>
<link rel="stylesheet" href="/vendor/bryntum/scheduler.css">
<link rel="stylesheet" href="/vendor/bryntum/svalbard-light.css">
<link rel="stylesheet" href="/vendor/bryntum/fontawesome/css/fontawesome.css">
<link rel="stylesheet" href="/vendor/bryntum/fontawesome/css/solid.css">
<style>html,body{margin:0;height:100%} #app{height:100vh;display:flex;flex-direction:column}</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { Scheduler } from "/vendor/bryntum/scheduler.module.js";
const doc = await (await fetch("/api/tournament")).json();
const resources = doc.courts.map(c => ({ id: c.id, name: c.name, venue: c.venue }));
const events = [];
for (const d of doc.divisions) for (const g of d.games) if (g.start && g.courtId) {
  const team = Object.fromEntries(d.teams.map(t => [t.id, t.name]));
  events.push({ id: g.id, resourceId: g.courtId, name: g.homeId ? `${team[g.homeId]} v ${team[g.awayId]}` : g.stage, startDate: g.start, duration: 75, durationUnit: "minute" });
}
const scheduler = new Scheduler({
  appendTo: "app", startDate: new Date(2026, 4, 16, 8, 30), endDate: new Date(2026, 4, 16, 19, 0), viewPreset: "hourAndDay",
  columns: [{ text: "Court", field: "name", width: 120 }], resources, events, rowHeight: 48, barMargin: 4,
});
window.__smoke = { resources: resources.length, events: events.length, rendered: () => document.querySelectorAll(".b-sch-event").length };
</script>
</body>
</html>
